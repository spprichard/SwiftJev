name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - run: swift --version
      - run: swift build
      - run: swift test

  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.1"]
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      # Resolve fresh, as a downstream consumer would; the committed pins can
      # require a newer tools version than the oldest supported toolchain.
      - run: rm -f Package.resolved
      - run: swift --version
      - run: swift build
      - run: swift test
